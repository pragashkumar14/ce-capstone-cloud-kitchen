<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pam Kitchen{% endblock %}</title>
    <style>
        :root {
            --primary: #2d8a4e;
            --primary-dark: #1f6b38;
            --accent: #4a90d9;
            --bg: #fff8f0;
            --card-bg: #ffffff;
            --text: #2b2118;
            --text-muted: #7a6a5a;
        }
        * { box-sizing: border-box; }
        body {
            overflow-x: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 760px;
            margin: 0 auto;
            padding: 0 20px 40px;
            background: var(--bg);
            color: var(--text);
        }
        header.site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 3px solid var(--primary);
            margin-bottom: 10px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }
        .brand-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-dark);
            letter-spacing: 0.5px;
        }
        h1 { color: var(--primary-dark); margin-bottom: 4px; }
        h2 {
            color: var(--primary-dark);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 6px;
            margin-top: 34px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 14px 16px;
            margin: 10px 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .item-icon { font-size: 1.6rem; margin-right: 12px; }
        .item-photo { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; margin-right: 12px; }
        .page-header-banner {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-top: -20px;
            max-height: 260px;
            object-fit: cover;
            display: block;
        }
        .menu-wrapper {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            background-image: url("https://cloud-kitchen-dev-images-20260901101749120000000001.s3.eu-west-3.amazonaws.com/images/menu-background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px calc(50vw - 380px + 20px);
            margin-top: 20px;
        }
        .menu-wrapper h1, .menu-wrapper p { color: #ffffff; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
        .checkout-wrapper {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            background-image: url("https://cloud-kitchen-dev-images-20260901101749120000000001.s3.eu-west-3.amazonaws.com/images/checkout-background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px calc(50vw - 380px + 20px) 60px;
            margin-top: 20px;
            min-height: 400px;
        }
        .checkout-wrapper h1, .checkout-wrapper p, .checkout-wrapper label { color: #ffffff; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
        .tab-bar { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
        .tab-btn {
            background: rgba(255,255,255,0.85);
            color: var(--primary-dark);
            border: 2px solid transparent;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
        }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .item-main { display: flex; align-items: center; }
        .item-name { font-weight: 700; color: var(--text); }
        .item-desc { color: var(--text-muted); font-size: 0.88em; margin-top: 2px; }
        .price { color: var(--primary-dark); font-weight: 700; white-space: nowrap; margin-left: 10px; }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: var(--primary-dark); }
        input, select {
            padding: 8px;
            margin: 4px 0;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .cart-link {
            background: var(--primary);
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
        }
        .cart-link:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <img src="https://cloud-kitchen-dev-images-20260901101749120000000001.s3.eu-west-3.amazonaws.com/images/logo.jpg" alt="Pam Kitchen" class="brand-logo">
            <span class="brand-name"><span style="color:#2d8a4e;">PAM</span> <span style="color:#4a90d9;">KITCHEN</span></span>
        </div>
        <a href="{{ url_for('view_cart') }}" class="cart-link">🛒 Cart</a>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
