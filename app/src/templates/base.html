<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cloud Kitchen{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #faf9f6; }
        h1 { color: #b34700; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 6px; margin-top: 30px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .item-name { font-weight: bold; }
        .item-desc { color: #666; font-size: 0.9em; }
        .price { color: #b34700; font-weight: bold; white-space: nowrap; margin-left: 10px; }
        button { background: #b34700; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #8f3900; }
        input, select { padding: 6px; margin: 4px 0; width: 100%; box-sizing: border-box; }
        .cart-link { position: fixed; top: 20px; right: 20px; background: #b34700; color: white; padding: 10px 16px; border-radius: 20px; text-decoration: none; }
    </style>
</head>
<body>
    <a href="{{ url_for('view_cart') }}" class="cart-link">🛒 Cart</a>
    {% block content %}{% endblock %}
</body>
</html>
